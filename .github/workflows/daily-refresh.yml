name: Daily refresh

on:
  schedule:
    - cron: "7 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask Claude for today's listings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/refresh.py
      - name: Save today's listings
        run: |
          git config user.name "Bertie's daily refresh"
          git config user.email "actions@users.noreply.github.com"
          git add daily.json
          git diff --cached --quiet && echo "No changes today." || (git commit -m "Daily listings for $(TZ=America/Chicago date +%F)" && git push)
